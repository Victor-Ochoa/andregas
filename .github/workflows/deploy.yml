name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Docker login manual antes do deploy: evita o passo login-to-registry do
      # aspire-ssh-deploy 0.1.0-ci.153 que quebra com 'IContainerRuntime' não registrado
      # (Aspire.Hosting.Docker 13.6.1). O push das imagens para o registry Magalu passa
      # pelo daemon local autenticado; na VM o pull usa as creds já persistidas em
      # ~/.docker/config.json (setup único).
      - name: Login to Magalu registry
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.DOCKER_REGISTRY_URL }}" \
              -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Deploy
        run: aspire deploy -e Production
        env:
          DockerSSH__TargetHost: ${{ secrets.TARGET_HOST }}
          DockerSSH__SshUsername: ${{ secrets.SSH_USERNAME }}
          DockerRegistry__RegistryUrl: ${{ secrets.DOCKER_REGISTRY_URL }}
          DockerRegistry__RepositoryPrefix: ${{ secrets.DOCKER_REGISTRY_PREFIX }}
          IMAGE_TAG_SUFFIX: build.${{ github.run_number }}.${{ env.SHORT_SHA }}
          Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__seed-admin-email: ${{ secrets.SEED_ADMIN_EMAIL }}
          Parameters__seed-admin-password: ${{ secrets.SEED_ADMIN_PASSWORD }}