name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy
        run: aspire deploy -e Production
        env:
          DockerSSH__TargetHost: ${{ secrets.TARGET_HOST }}
          DockerSSH__SshUsername: ${{ secrets.SSH_USERNAME }}
          DockerRegistry__RegistryUrl: ${{ secrets.DOCKER_REGISTRY_URL }}
          DockerRegistry__RepositoryPrefix: ${{ secrets.DOCKER_REGISTRY_PREFIX }}
          DockerRegistry__RegistryUsername: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DockerRegistry__RegistryPassword: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          IMAGE_TAG_SUFFIX: build.${{ github.run_number }}.${{ env.SHORT_SHA }}
          Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__seed-admin-email: ${{ secrets.SEED_ADMIN_EMAIL }}
          Parameters__seed-admin-password: ${{ secrets.SEED_ADMIN_PASSWORD }}